<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenApiVoipClient demo</title>
    <style>
      body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 20px auto; padding: 0 16px; }
      fieldset { margin-bottom: 12px; }
      label { display: inline-block; width: 150px; }
      input[type=text], input[type=password] { width: 260px; }
      button { margin: 2px 4px 2px 0; }
      #state { font-weight: bold; font-size: 1.2em; padding: 2px 8px; border-radius: 4px; }
      #state.incoming { background: #ffcc00; animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0.3; } }
      #log {
        white-space: pre-wrap; font-family: monospace; font-size: 12px;
        background: #111; color: #0f0; height: 220px; overflow-y: auto; padding: 8px;
      }
      .row { margin-bottom: 6px; }
      .hint { color: #666; font-size: 0.9em; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <h2>GreenApiVoipClient — example</h2>

    <fieldset id="connectFieldset">
      <legend>Connection</legend>
      <p class="hint">The instance must already be authorized — this demo only deals with calls.</p>
      <div class="row"><label>apiUrl</label><input type="text" id="apiUrl"></div>
      <div class="row"><label>idInstance</label><input type="text" id="idInstance"></div>
      <div class="row"><label>apiTokenInstance</label><input type="password" id="apiTokenInstance"></div>
      <div class="row"><button id="connectButton">Connect</button></div>
    </fieldset>

    <fieldset id="stateFieldset" style="display: none;">
      <legend>State</legend>
      <div>Call: <span id="state">-</span></div>
      <button id="resetButton">Disconnect</button>
    </fieldset>

    <fieldset id="dialFieldset" style="display: none;">
      <legend>Outgoing call</legend>
      <div class="row">
        <label>Number / chatId</label><input type="text" id="dialTarget" placeholder="79991234567">
        <button id="dialButton">Dial</button>
      </div>
    </fieldset>

    <fieldset id="incomingFieldset" style="display: none;">
      <legend>Incoming call</legend>
      <div id="incomingCallInfo"></div>
      <button id="acceptButton">Accept</button>
      <button id="rejectButton">Reject</button>
    </fieldset>

    <fieldset id="activeCallFieldset" style="display: none;">
      <legend>Current call</legend>
      <button id="connectMediaButton" style="display: none;">Join the call audio</button>
      <button id="hangUpButton">Hang up</button>
      <audio id="remoteAudio" autoplay playsinline></audio>
    </fieldset>

    <fieldset>
      <legend>Log</legend>
      <div class="row"><button id="clearLogButton">Clear log</button></div>
      <div id="log"></div>
    </fieldset>

    <script type="module" src="/index.js"></script>
  </body>
</html>
